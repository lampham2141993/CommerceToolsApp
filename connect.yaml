deployAs:
  - name: merchant-center-custom-application
    applicationType: merchant-center-custom-application
    scripts:
      postDeploy: node scripts/post-deploy.js
      preUndeploy: node scripts/pre-undeploy.js
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: The Custom Application ID from Merchant Center registration
          required: true
          default: 'cmu6qhduc000l0104anv1gjrz'
        - key: ENTRY_POINT_URI_PATH
          description: The Application entry point URI path
          required: true
          default: 'starter-typescript-4e8eec'
        - key: CLOUD_IDENTIFIER
          description: The cloud identifier for the Project region
          required: true
          default: 'gcp-au'
        - key: ENABLE_NEW_JSX_TRANSFORM
          description: Enable the automatic React JSX runtime for the Custom Application build
          required: true
          default: 'true'
